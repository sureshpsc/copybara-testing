apiVersion: evolvectl.dev/v1alpha1
kind: MigrationRecipe
metadata:
  id: acme.retry.max-attempts
  title: Rename retry.Config.MaxTries to MaxAttempts
  owners:
    - platform-team
  tags:
    - go
    - acme-retry
spec:
  language: go
  dependency:
    ecosystem: gomod
    name: github.com/acme/retry
    from: "<2.0.0"
    to: ">=2.0.0"
  match:
    type: struct_field
    field: MaxTries
  transform:
    type: struct_field_rename
    target_field: MaxAttempts
  safety:
    confidence: high
    generated_files: deny
    require_type_info: false
  validate:
    - gofmt
